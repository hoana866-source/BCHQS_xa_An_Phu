<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5fab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Công việc KPI">
<title>BCHQS xã An Phú – Công việc & KPI</title>
<style>
:root{
  --bg:#eef1f6;--bg2:#e6ebf3;--card:#fff;--card2:#f8fafc;--tx:#1c2433;--mut:#667085;--bd:#dde3ec;--bd2:#cfd7e3;
  --pri:#2b5fab;--pri-s:rgba(43,95,171,.09);--in:#fff;--track:#e9edf3;
  --ok:#2f855a;--ok-s:rgba(47,133,90,.11);--early:#2c7a8c;--early-s:rgba(44,122,140,.11);
  --warn:#b7791f;--warn-s:rgba(183,121,31,.12);--bad:#c0504d;--bad-s:rgba(192,80,77,.11);--open:#8a99b0;--open-s:rgba(138,153,176,.14);
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
:root[data-theme=dark]{
  --bg:#0f141a;--bg2:#121922;--card:#18202a;--card2:#1c2530;--tx:#e6eaf0;--mut:#98a3b3;--bd:#263140;--bd2:#2f3b4c;
  --pri:#6b9be0;--pri-s:rgba(107,155,224,.13);--in:#121922;--track:#243041;
  --ok:#5fb98a;--ok-s:rgba(95,185,138,.14);--early:#5bb1c2;--early-s:rgba(91,177,194,.14);
  --warn:#d9a54d;--warn-s:rgba(217,165,77,.15);--bad:#e07a76;--bad-s:rgba(224,122,118,.14);--open:#8494ab;--open-s:rgba(132,148,171,.16);
  --sh:0 1px 2px rgba(0,0,0,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f141a;--bg2:#121922;--card:#18202a;--card2:#1c2530;--tx:#e6eaf0;--mut:#98a3b3;--bd:#263140;--bd2:#2f3b4c;
  --pri:#6b9be0;--pri-s:rgba(107,155,224,.13);--in:#121922;--track:#243041;
  --ok:#5fb98a;--ok-s:rgba(95,185,138,.14);--early:#5bb1c2;--early-s:rgba(91,177,194,.14);
  --warn:#d9a54d;--warn-s:rgba(217,165,77,.15);--bad:#e07a76;--bad-s:rgba(224,122,118,.14);--open:#8494ab;--open-s:rgba(132,148,171,.16);
  --sh:0 1px 2px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html[data-font=large] body{zoom:1.13}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);background-image:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px);background-attachment:fixed;color:var(--tx);font-size:15px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.brand{flex:1;min-width:0}
.brand h1{font-size:16px;margin:0;color:var(--pri);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand div{font-size:12px;color:var(--mut)}
.who{font-size:12px;color:var(--mut);text-align:right;line-height:1.3}
.icon-btn{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.icon-btn.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:14px 12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:150px;border:0;background:none;padding:8px 2px 7px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;position:relative}
nav button.on{color:var(--pri);font-weight:600}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:2px;background:var(--pri)}
nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-weight:700}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
h4{font-size:14px;margin:14px 0 6px}
.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:18px 2px 8px;color:var(--tx)}
.sec::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--pri)}
.sec .sp{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.card.hl{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.card.soft{background:var(--card2)}
.mut{color:var(--mut);font-size:13px}
.sp{flex:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.btn{border:1px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--bd2);border-radius:9px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.inl{display:flex;gap:6px;margin-top:4px}
.inl input{flex:1}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.filters input{grid-column:1/-1}
@media(min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}.filters input{grid-column:auto}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip b{color:var(--mut)}.chip.c-bad b{color:var(--bad)}.chip.c-warn b{color:var(--warn)}
.chip.on b{color:#fff!important}
/* ô số liệu */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;box-shadow:var(--sh);cursor:pointer;border-top:3px solid var(--c,var(--pri))}
.tile .n{font-size:26px;font-weight:700;color:var(--c,var(--pri));line-height:1.15}
.tile .l{font-size:12.5px;color:var(--mut)}
/* công việc */
.task{border-left:3px solid var(--bd2);cursor:pointer}
.task.st-overdue,.task.st-late{border-left-color:var(--bad)}
.task.st-soon{border-left-color:var(--warn)}
.task.st-early{border-left-color:var(--early)}
.task.st-ontime,.task.st-done{border-left-color:var(--ok)}
.task.st-doing{border-left-color:var(--pri)}
.row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.ttl{font-weight:600;margin-bottom:3px;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;font-weight:600;background:var(--open-s);color:var(--mut)}
.b-overdue,.b-late{background:var(--bad-s);color:var(--bad)}
.b-soon{background:var(--warn-s);color:var(--warn)}
.b-early{background:var(--early-s);color:var(--early)}
.b-ontime,.b-done{background:var(--ok-s);color:var(--ok)}
.b-doing{background:var(--pri-s);color:var(--pri)}
.q-tot{background:var(--ok-s);color:var(--ok)}
.q-dat{background:var(--pri-s);color:var(--pri)}
.q-kem{background:var(--bad-s);color:var(--bad)}
/* danh sách gọn */
.list{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--bd);cursor:pointer}
.li:first-child{border-top:0}
.li .mk{width:4px;align-self:stretch;border-radius:2px;background:var(--c,var(--bd2))}
.li .body{flex:1;min-width:0}
.li .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mut)}
.grp{padding:6px 12px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card2);border-top:1px solid var(--bd);text-transform:uppercase;letter-spacing:.4px}
.grp:first-child{border-top:0}
/* biểu đồ */
.two{display:grid;gap:10px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{width:130px;height:130px;flex:none}
.dn-big{font-size:24px;font-weight:700;fill:var(--tx)}
.dn-sub{font-size:11px;fill:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut)}
.legend.col{flex-direction:column;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sb-row{display:grid;grid-template-columns:minmax(80px,32%) 1fr 30px;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.sb-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-track{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.sb-bar{display:flex;height:100%;border-radius:7px;overflow:hidden}
.sb-bar span{display:block;height:100%}
.sb-bar span+span{border-left:1.5px solid var(--card)}
.sb-n{font-size:12.5px;color:var(--mut);text-align:right}
.trend{width:100%;height:auto;display:block}
.trend .g{stroke:var(--bd);stroke-width:1}
.trend{max-height:300px}
.trend .gl{fill:var(--mut);font-size:10.5px}
.trend .ln{fill:none;stroke:var(--pri);stroke-width:2;stroke-linejoin:round}
.trend .ar{fill:var(--pri-s);stroke:none}
.trend .pt{fill:var(--card);stroke:var(--pri);stroke-width:2}
.trend .pv{fill:var(--tx);font-size:11px;font-weight:700}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.rk:first-child{border-top:0}
.rk .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--pri-s);color:var(--pri);flex:none}
.rk .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* bảng */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{background:var(--card2);font-weight:600;color:var(--mut)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th:first-child{background:var(--card2)}
td a{color:var(--pri);text-decoration:none;cursor:pointer}
tr.tot td{font-weight:700;background:var(--card2)}
.score{font-weight:700}
.staff-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.staff-row .nm{font-weight:600}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pri-s);color:var(--pri);font-weight:700;font-size:14px;flex:none}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.kv b{display:block;font-size:18px;color:var(--pri)}
.kv span{font-size:11.5px;color:var(--mut)}
.mbg{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--bd)}
@media(min-width:640px){.mbg{align-items:center}.modal{border-radius:16px}}
.ext{background:var(--warn-s);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.log{white-space:pre-wrap;font-size:12.5px;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:8px;margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:14px}
.chk input{width:auto;margin-top:3px}
.cf{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.cf .chk{margin:4px 0}
.code{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:1px;color:var(--pri)}
ul{padding-left:20px;margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-size:14px}
.help li{margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--tx);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--bd2)}
.seg button.on{background:var(--pri);color:#fff}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="appTitle">BCHQS xã An Phú</h1><div>Theo dõi công việc & KPI</div></div>
  <div class="who" id="who"></div>
  <button class="icon-btn" id="setBtn" title="Cài đặt" onclick="go('set')"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script>
"use strict";
/* ================== TIỆN ÍCH ================== */
const K='kpi_tracker_v1', KU=K+'_undo';
let db=null, tab='home', kpiP=null, imp=null;
const ui={q:'',staff:'',st:'open',asg:'',trend:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const fmtD=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const fmtDM=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const fmtT=t=>{if(!t)return '';const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+' '+fmtD(iso(d))};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const last=new Date(y,m-1+n+1,0).getDate();return iso(new Date(y,m-1+n,Math.min(d,last)))};
const WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const dayLabel=s=>{const n=dayDiff(today(),s);return n===0?'Hôm nay':n===1?'Ngày mai':WD[pd(s).getDay()]+', '+fmtDM(s)};
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'user';
const clone=o=>JSON.parse(JSON.stringify(o));
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return (p.length>1?p[p.length-2][0]+p[p.length-1][0]:p[0][0]||'?').toUpperCase()};
const defSettings=()=>({latePenalty:10,qTot:100,qDat:80,qKem:50,days:7,origDue:true,theme:'',font:'',appTitle:'BCHQS xã An Phú'});
const REP={'':'Không lặp',w:'Hằng tuần',m:'Hằng tháng',q:'Hằng quý'};

function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('⚠ Không lưu được dữ liệu! Hãy xuất file sao lưu ngay.',5000)}}

/* ================== BẢN GHI (mỗi trường có v,t,d) ================== */
const V=(r,k)=>{const e=r&&r.f&&r.f[k];return e?e.v:''};
function mk(obj){const r={id:uid(),f:{}},t=Date.now();for(const k in obj)r.f[k]={v:obj[k],t,d:db.me.id};return r}
function setF(r,k,v){const e=r.f[k];if(e&&e.v===v)return false;if(!e&&(v===''||v===false))return false;r.f[k]={v,t:Date.now(),d:db.me.id};return true}
function canon(id,al){al=al||db.aliases;let x=id,n=0;while(x&&al[x]&&n++<50)x=al[x];return x||''}
const staffOf=id=>id?db.staff[canon(id)]:null;
const live=o=>Object.values(o).filter(r=>!V(r,'deleted'));
function lastEdit(r){let b=null;for(const k in r.f){const e=r.f[k];if(!b||e.t>b.t)b=e}return b?`Sửa lần cuối: ${esc(db.peers[b.d]||'?')} lúc ${fmtT(b.t)}`:''}
function assigners(){const s=new Set(Object.values(db.peers));s.add(db.me.name);live(db.tasks).forEach(t=>{const a=V(t,'assigner');if(a)s.add(a)});return [...s].sort((a,b)=>a.localeCompare(b,'vi'))}
function staffTree(){
  const list=live(db.staff).sort((a,b)=>V(a,'name').localeCompare(V(b,'name'),'vi'));
  const ids=new Set(list.map(r=>r.id)),kids={},roots=[];
  for(const r of list){const p=canon(V(r,'parent'));if(p&&ids.has(p)&&p!==r.id)(kids[p]=kids[p]||[]).push(r);else roots.push(r)}
  const out=[],seen=new Set();
  const walk=(r,lv)=>{if(seen.has(r.id))return;seen.add(r.id);out.push({r,lv});(kids[r.id]||[]).forEach(c=>walk(c,lv+1))};
  roots.forEach(r=>walk(r,0));list.forEach(r=>{if(!seen.has(r.id))walk(r,0)});
  return out;
}

/* ================== TRẠNG THÁI & KPI ================== */
function statusAt(t,due){
  const done=V(t,'done');
  if(done){
    if(!due)return {k:'done',label:'Hoàn thành',d:0};
    const d=dayDiff(due,done);
    if(d<0)return {k:'early',label:`Xong sớm ${-d} ngày`,d};
    if(d===0)return {k:'ontime',label:'Xong đúng hạn',d};
    return {k:'late',label:`Xong trễ ${d} ngày`,d};
  }
  if(!due)return {k:'doing',label:'Đang làm (chưa đặt hạn)'};
  const d=dayDiff(today(),due);
  if(d<0)return {k:'overdue',label:`Quá hạn ${-d} ngày`,d:-d};
  if(d<=2)return {k:'soon',label:d===0?'Hạn hôm nay':`Còn ${d} ngày`};
  return {k:'doing',label:`Còn ${d} ngày`};
}
const status=t=>statusAt(t,V(t,'due'));
const kDue=t=>(db.settings.origDue&&V(t,'dueOrig'))||V(t,'due');
const kStatus=t=>statusAt(t,kDue(t));
function taskScore(t){
  const s=kStatus(t),S=db.settings;
  if(!V(t,'done'))return s.k==='overdue'?0:null;
  const base=s.k==='late'?Math.max(0,100-S.latePenalty*s.d):100;
  const q=V(t,'quality');const w=q==='Tốt'?S.qTot:q==='Đạt'?S.qDat:q==='Kém'?S.qKem:100;
  return base*w/100;
}
const rank=s=>s===null?'':s>=90?'Xuất sắc':s>=75?'Tốt':s>=50?'Đạt':'Chưa đạt';
function inPeriod(t,from,to){const ref=kDue(t)||V(t,'start');return ref&&ref>=from&&ref<=to}
function computeKPI(from,to){
  const R={};
  for(const t of live(db.tasks)){
    if(!inPeriod(t,from,to))continue;
    const sid=canon(V(t,'staff'))||'_';
    const r=R[sid]||(R[sid]={sid,total:0,done:0,early:0,ontime:0,late:0,overdue:0,open:0,dev:0,devN:0,tot:0,dat:0,kem:0,sc:0,scN:0});
    r.total++;const s=kStatus(t);
    if(V(t,'done')){r.done++;if(s.k==='early')r.early++;else if(s.k==='late')r.late++;else r.ontime++;if(kDue(t)){r.dev+=s.d;r.devN++}}
    else if(s.k==='overdue')r.overdue++;else r.open++;
    const q=V(t,'quality');if(q==='Tốt')r.tot++;else if(q==='Đạt')r.dat++;else if(q==='Kém')r.kem++;
    const sc=taskScore(t);if(sc!==null){r.sc+=sc;r.scN++}
  }
  return Object.values(R).map(fin).sort((a,b)=>(b.score??-1)-(a.score??-1)||b.total-a.total);
}
function fin(r){return {...r,avgDev:r.devN?r.dev/r.devN:null,score:r.scN?r.sc/r.scN:null,onRate:r.done?(r.early+r.ontime)/r.done:null}}
function sumKPI(rows){const z={sid:'ALL',total:0,done:0,early:0,ontime:0,late:0,overdue:0,open:0,dev:0,devN:0,tot:0,dat:0,kem:0,sc:0,scN:0};rows.forEach(r=>{for(const k in z)if(k!=='sid')z[k]+=r[k]});return fin(z)}
function periodPreset(p){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();let a,b;
  if(p==='pm'){a=new Date(y,m-1,1);b=new Date(y,m,0)}
  else if(p==='q'){const q=Math.floor(m/3)*3;a=new Date(y,q,1);b=new Date(y,q+3,0)}
  else if(p==='y'){a=new Date(y,0,1);b=new Date(y,11,31)}
  else{a=new Date(y,m,1);b=new Date(y,m+1,0)}
  return {from:iso(a),to:iso(b),p};
}
function kpiMonths(sid,n=6){
  const d=new Date(),out=[];
  for(let i=n-1;i>=0;i--){
    const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,0);
    const rows=computeKPI(iso(a),iso(b));const r=sid?rows.find(x=>x.sid===sid):sumKPI(rows);
    out.push({label:'T'+(a.getMonth()+1),score:r&&r.score!==null?r.score:null,total:r?r.total:0});
  }
  return out;
}

function mergeByT(a,b){for(const k in b.f){if(!a.f[k]||b.f[k].t>a.f[k].t)a.f[k]=b.f[k]}}
function doMerge(file,choices){
  const w=clone(db),me=w.me.id,peer=file.me.id;
  const myLast=w.lastImportFrom[peer]||0,theirLast=(file.lastImportFrom||{})[me]||0;
  const T=Date.now(),conflicts=[],dups=[],st={ns:0,us:0,nt:0,ut:0};
  for(const [a,b] of Object.entries(file.aliases||{})){if(!w.aliases[a]&&canon(b,w.aliases)!==a)w.aliases[a]=b}
  for(const key of Object.keys(w.staff)){const c=canon(key,w.aliases);if(c!==key){const L=w.staff[key];delete w.staff[key];L.id=c;if(w.staff[c])mergeByT(w.staff[c],L);else w.staff[c]=L}}
  const mergeRec=(type,L,R)=>{
    let ch=false;
    for(const k in R.f){
      const l=L.f[k],r=R.f[k];
      if(!l){L.f[k]=r;ch=true;continue}
      if(JSON.stringify(l.v)===JSON.stringify(r.v)){if(r.t>l.t)L.f[k]=r;continue}
      const lU=l.d===me&&l.t>theirLast, rU=r.d===peer&&r.t>myLast;
      if(lU&&rU){
        const key=type+':'+L.id+':'+k;
        const c=choices[key]||(r.t>l.t?'them':'me');
        conflicts.push({key,type,id:L.id,k,l,r,c});
        L.f[k]={v:c==='them'?r.v:l.v,t:T,d:me};ch=true;
      }else if(rU||(!lU&&r.t>l.t)){L.f[k]=r;ch=true}
    }
    return ch;
  };
  const rset=new Set(Object.keys(file.staff||{}).map(id=>canon(id,w.aliases)));
  for(const R0 of Object.values(file.staff||{})){
    const R=clone(R0);const rid=canon(R.id,w.aliases);R.id=rid;
    if(w.staff[rid]){if(mergeRec('s',w.staff[rid],R))st.us++;continue}
    const nm=norm(V(R,'name'));
    const L=nm&&!V(R,'deleted')?Object.values(w.staff).find(x=>!V(x,'deleted')&&norm(V(x,'name'))===nm&&!rset.has(x.id)):null;
    if(L){
      const key='dup:'+rid+':'+L.id,ok=choices[key]!==false;
      dups.push({key,name:V(R,'name'),lpos:V(L,'pos'),rpos:V(R,'pos'),ok});
      if(ok){
        if(rid<L.id){delete w.staff[L.id];w.aliases[L.id]=rid;L.id=rid;w.staff[rid]=L}
        else{w.aliases[rid]=L.id;R.id=L.id}
        rset.add(L.id);mergeRec('s',w.staff[L.id],R);st.us++;continue;
      }
    }
    w.staff[rid]=R;st.ns++;
  }
  for(const R0 of Object.values(file.tasks||{})){
    const R=clone(R0),L=w.tasks[R.id];
    if(L){if(mergeRec('t',L,R))st.ut++}else{w.tasks[R.id]=R;st.nt++}
  }
  for(const [id,n] of Object.entries(file.peers||{}))if(id!==me)w.peers[id]=n;
  w.peers[peer]=file.me.name;
  w.lastImportFrom[peer]=Math.max(w.lastImportFrom[peer]||0,file.exportedAt||0);
  w.log=w.log||[];w.log.unshift({at:T,name:file.me.name,fileAt:file.exportedAt,st,cf:conflicts.length});w.log=w.log.slice(0,30);
  return {w,conflicts,dups,st};
}
function dataHash(d){
  d=d||db;const parts=[];
  for(const typ of ['staff','tasks']){const o=d[typ];Object.keys(o).sort().forEach(id=>{const r=o[id];parts.push(typ[0]+id+'|'+Object.keys(r.f).sort().map(k=>k+'='+JSON.stringify(r.f[k].v)).join('|'))})}
  let h=0x811c9dc5;const s=parts.join('\n');
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return h.toString(16).toUpperCase().padStart(8,'0');
}

}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    dv.setUint32(14,crc,true);dv.setUint32(18,sz,true);dv.setUint32(22,sz,true);dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);lh.set(nb,30);

    cv.setUint32(16,crc,true);cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);cv.setUint16(28,nb.length,true);cv.setUint32(42,off,true);ch.set(nb,46);

function donut(segs,center,sub){
  const total=segs.reduce((a,s)=>a+s.v,0),R=52,C=2*Math.PI*R;let off=0;
  const arcs=total?segs.filter(s=>s.v>0).map(s=>{const len=C*s.v/total;const a=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s.c}" stroke-width="15" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return a}).join(''):'';
  return `<svg viewBox="0 0 140 140" class="donut"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--track)" stroke-width="15"/>${arcs}<text x="70" y="72" text-anchor="middle" class="dn-big">${center}</text><text x="70" y="91" text-anchor="middle" class="dn-sub">${sub}</text></svg>`;
}
function stackBars(rows){
  if(!rows.length)return '<div class="empty">Chưa có dữ liệu</div>';
  const max=Math.max(1,...rows.map(r=>r.total));
  return rows.map(r=>{const nm=r.sid==='_'?'(Chưa giao)':staffName(r.sid)||'(?)';
    return `<div class="sb-row" ${r.sid!=='_'?`onclick="openProfile('${r.sid}')"`:''}><div class="sb-name" title="${esc(nm)}">${esc(nm)}</div>
    <div class="sb-track"><div class="sb-bar" style="width:${r.total/max*100}%">${SEG.map(([k,l,c])=>r[k]?`<span style="flex:${r[k]};background:${c}" title="${l}: ${r[k]}"></span>`:'').join('')}</div></div><div class="sb-n">${r.total}</div></div>`}).join('')+`<div style="margin-top:8px">${legend()}</div>`;
}
function trendSvg(pts){
  const W=360,H=190,L=28,Rr=14,T=26,B=24,n=pts.length;
  const x=i=>L+(W-L-Rr)*(n===1?.5:i/(n-1)),y=v=>T+(H-T-B)*(1-v/100);
  let g='';[0,50,75,90,100].forEach(v=>{g+=`<line class="g" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" ${v===75||v===90?'stroke-dasharray="4 4"':''}/><text class="gl" x="${L-5}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  let lab='';pts.forEach((p,i)=>{lab+=`<text class="gl" x="${x(i)}" y="${H-8}" text-anchor="middle">${p.label}</text>`});
  let segs=[],cur=[];pts.forEach((p,i)=>{if(p.score===null){if(cur.length)segs.push(cur);cur=[]}else cur.push([x(i),y(p.score)])});if(cur.length)segs.push(cur);
  const line=segs.map(s=>`<path class="ln" d="M${s.map(q=>q.join(',')).join('L')}"/>`).join('');
  const area=segs.filter(s=>s.length>1).map(s=>`<path class="ar" d="M${s[0][0]},${y(0)}L${s.map(q=>q.join(',')).join('L')}L${s[s.length-1][0]},${y(0)}Z"/>`).join('');
  const dots=pts.map((p,i)=>p.score===null?'':`<circle class="pt" cx="${x(i)}" cy="${y(p.score)}" r="3.5"/><text class="pv" x="${x(i)}" y="${y(p.score)-9}" text-anchor="middle">${Math.round(p.score)}</text>`).join('');
  const none=pts.every(p=>p.score===null)?`<text class="gl" x="${W/2}" y="${H/2}" text-anchor="middle">Chưa có dữ liệu</text>`:'';
  return `<svg class="trend" viewBox="0 0 ${W} ${H}">${g}${area}${line}${dots}${lab}${none}</svg>`;
}

function liTask(t){
  const s=status(t),st=staffOf(V(t,'staff'));
  const c={overdue:'var(--bad)',soon:'var(--warn)',doing:'var(--pri)',late:'var(--warn)',early:'var(--early)'}[s.k]||'var(--ok)';
  return `<div class="li" onclick="openTask('${t.id}')"><div class="mk" style="--c:${c}"></div>
    <div class="body"><div class="t">${esc(V(t,'title'))}</div><div class="s">${st?esc(V(st,'name')):'<i>chưa chọn người</i>'} · <span style="color:${c}">${s.label}</span>${V(t,'dueOrig')?' · đã gia hạn':''}</div></div>
    ${!V(t,'done')?`<button class="btn sm ok" onclick="event.stopPropagation();quickDone('${t.id}')">✓</button>`:''}</div>`;
}
function setDays(n){db.settings.days=n;save();render()}
function renderHome(){
  const all=live(db.tasks),td=today(),X=db.settings.days||7,lim=addDays(td,X);
  const open=all.filter(t=>!V(t,'done')),byDue=(a,b)=>(V(a,'due')||'').localeCompare(V(b,'due')||'');
  const overdue=open.filter(t=>V(t,'due')&&V(t,'due')<td).sort(byDue);
  const dueToday=open.filter(t=>V(t,'due')===td);
  const upcoming=open.filter(t=>V(t,'due')&&V(t,'due')>=td&&V(t,'due')<=lim).sort(byDue);
  const m=periodPreset('m'),rows=computeKPI(m.from,m.to),tot=sumKPI(rows);
  const doneMonth=all.filter(t=>V(t,'done')>=m.from&&V(t,'done')<=m.to).length;
  if(!live(db.staff).length&&!all.length){
    $('#main').innerHTML=`<div class="card hl"><h3>Chào ${esc(db.me.name)} 👋</h3><p class="mut">Bắt đầu bằng cách thêm danh sách nhân viên, sau đó giao việc. Nếu người kia đã nhập danh sách, hãy nhận file của họ ở tab <b>Đồng bộ</b>.</p>
    <div class="bar"><button class="btn pri" onclick="go('staff')">Thêm nhân viên</button><button class="btn" onclick="go('sync')">Nhận file đồng bộ</button></div></div>`;return;
  }
  // Sắp đến hạn, nhóm theo ngày
  let up='',last='';upcoming.forEach(t=>{const d=V(t,'due');if(d!==last){up+=`<div class="grp">${dayLabel(d)}</div>`;last=d}up+=liTask(t)});
  // xếp hạng
  const best=rows.filter(r=>r.sid!=='_'&&r.score!==null).slice(0,3);
  const load={};open.forEach(t=>{const s=canon(V(t,'staff'));if(!s)return;const o=load[s]||(load[s]={sid:s,o:0,x:0});o.o++;if(V(t,'due')&&V(t,'due')<td)o.x++});
  const busy=Object.values(load).sort((a,b)=>b.x-a.x||b.o-a.o).slice(0,3);
  const pct=tot.onRate===null?'—':Math.round(tot.onRate*100)+'%';
  $('#main').innerHTML=`
  <div class="tiles">
    <div class="tile" style="--c:var(--bad)" onclick="ui.st='overdue';ui.staff='';go('tasks')"><div class="n">${overdue.length}</div><div class="l">Quá hạn</div></div>
    <div class="tile" style="--c:var(--warn)" onclick="ui.st='today';ui.staff='';go('tasks')"><div class="n">${dueToday.length}</div><div class="l">Đến hạn hôm nay</div></div>
    <div class="tile" style="--c:var(--pri)" onclick="ui.st='next';ui.staff='';go('tasks')"><div class="n">${upcoming.length}</div><div class="l">Phải xong trong ${X} ngày</div></div>
    <div class="tile" style="--c:var(--ok)" onclick="go('kpi')"><div class="n">${doneMonth}</div><div class="l">Đã xong tháng này</div></div>
  </div>
  ${overdue.length?`<div class="sec">Quá hạn chưa xong<span class="sp"></span><span class="mut">${overdue.length} việc</span></div><div class="list">${overdue.slice(0,8).map(liTask).join('')}${overdue.length>8?`<div class="li" onclick="ui.st='overdue';go('tasks')"><div class="body mut">Xem tất cả ${overdue.length} việc quá hạn →</div></div>`:''}</div>`:''}
  <div class="sec">Phải hoàn thành trong<span class="sp"></span></div>
  <div class="chips">${[3,7,14,30].map(n=>`<button class="chip ${X===n?'on':''}" onclick="setDays(${n})">${n} ngày</button>`).join('')}</div>
  <div class="list">${up||`<div class="empty">Không có việc nào đến hạn trong ${X} ngày tới.</div>`}</div>
  <div class="sec">Tháng ${new Date().getMonth()+1}</div>
  <div class="two">
    <div class="card"><div class="donut-wrap">${donut([{v:tot.early,c:'var(--early)'},{v:tot.ontime,c:'var(--ok)'},{v:tot.late,c:'var(--warn)'},{v:tot.overdue,c:'var(--bad)'},{v:tot.open,c:'var(--open)'}],pct,'đúng hạn')}
      <div><div class="legend col">${SEG.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}: <b style="color:var(--tx)">${tot[k]}</b></span>`).join('')}</div>
      <div class="mut" style="margin-top:6px">Điểm KPI đơn vị: <b style="color:var(--pri)">${tot.score===null?'—':Math.round(tot.score)}</b></div></div></div></div>
    <div class="card"><h3>Hoàn thành tốt nhất</h3>${best.length?best.map((r,i)=>`<div class="rk" onclick="openProfile('${r.sid}')"><span class="no">${i+1}</span><span class="nm">${esc(staffName(r.sid))}</span><b style="color:var(--ok)">${Math.round(r.score)}</b></div>`).join(''):'<div class="mut">Chưa có việc hoàn thành trong tháng.</div>'}
      <h3 style="margin-top:12px">Đang tồn nhiều việc</h3>${busy.length?busy.map(o=>`<div class="rk" onclick="openProfile('${o.sid}')"><span class="no" style="background:var(--warn-s);color:var(--warn)">${o.o}</span><span class="nm">${esc(staffName(o.sid))}</span>${o.x?`<span class="badge b-overdue">${o.x} quá hạn</span>`:''}</div>`).join(''):'<div class="mut">Không ai tồn việc.</div>'}</div>
  </div>
  <div class="bar"><button class="btn pri" onclick="openTask()">＋ Giao việc mới</button></div>`;

const ST_OPTS=()=>[['open','Chưa hoàn thành'],['overdue','Quá hạn'],['today','Đến hạn hôm nay'],['next',`Phải xong trong ${db.settings.days||7} ngày`],['done','Đã hoàn thành'],['late','Hoàn thành trễ'],['ext','Đã gia hạn'],['rep','Việc lặp lại'],['all','Tất cả']];
function setSt(s){ui.st=s;render()}
function filteredTasks(){
  const q=norm(ui.q),td=today(),lim=addDays(td,db.settings.days||7);
  return live(db.tasks).filter(t=>{
    const s=status(t),due=V(t,'due'),done=V(t,'done');
    if(ui.staff&&canon(V(t,'staff'))!==ui.staff)return false;
    if(ui.asg&&V(t,'assigner')!==ui.asg)return false;
    if(q){const hay=norm(V(t,'title')+' '+V(t,'note')+' '+staffName(V(t,'staff')));if(!hay.includes(q))return false}
    switch(ui.st){case 'open':return !done;case 'overdue':return s.k==='overdue';case 'today':return !done&&due===td;
      case 'next':return !done&&due&&due>=td&&due<=lim;case 'done':return !!done;case 'late':return kStatus(t).k==='late';
      case 'ext':return !!V(t,'dueOrig');case 'rep':return !!V(t,'repeat');default:return true}
  }).sort((a,b)=>{const da=V(a,'done'),dd=V(b,'done');if(!da&&dd)return -1;if(da&&!dd)return 1;if(!da)return (V(a,'due')||'9999').localeCompare(V(b,'due')||'9999');return dd.localeCompare(da)});
}
function renderTasks(){
  const tree=staffTree(),asgs=assigners(),td=today();let open=0,over=0,tday=0;
  live(db.tasks).forEach(t=>{if(!V(t,'done')){open++;const d=V(t,'due');if(d&&d<td)over++;else if(d===td)tday++}});
  $('#main').innerHTML=`
  <div class="chips">
    <button class="chip ${ui.st==='open'?'on':''}" onclick="setSt('open')">Chưa xong <b>${open}</b></button>
    <button class="chip c-bad ${ui.st==='overdue'?'on':''}" onclick="setSt('overdue')">Quá hạn <b>${over}</b></button>
    <button class="chip c-warn ${ui.st==='today'?'on':''}" onclick="setSt('today')">Hôm nay <b>${tday}</b></button>
    <button class="chip ${ui.st==='next'?'on':''}" onclick="setSt('next')">${db.settings.days||7} ngày tới</button>
  </div>
  <div class="filters">
    <input id="fq" type="search" placeholder="Tìm nội dung, tên người..." value="${esc(ui.q)}">
    <select id="fst">${ST_OPTS().map(([k,l])=>`<option value="${k}" ${ui.st===k?'selected':''}>${l}</option>`).join('')}</select>
    <select id="fsf"><option value="">Tất cả nhân viên</option>${tree.map(({r,lv})=>`<option value="${r.id}" ${ui.staff===r.id?'selected':''}>${'— '.repeat(lv)}${esc(V(r,'name'))}</option>`).join('')}</select>
    <select id="fas"><option value="">Mọi người giao</option>${asgs.map(a=>`<option ${ui.asg===a?'selected':''}>${esc(a)}</option>`).join('')}</select>

  renderTaskList();

function quickDone(id){const t=db.tasks[id];setF(t,'done',today());afterDone(t);save();render();toast('Đã hoàn thành. Bấm vào việc để đánh giá Tốt/Đạt/Kém.')}
function openTask(id,presetStaff){
  const t=id?db.tasks[id]:null,g=k=>t?V(t,k):'';
  const tree=staffTree(),asgs=assigners(),cur=t?g('assigner'):db.me.name,sid=t?canon(g('staff')):(presetStaff||'');
  if(cur&&!asgs.includes(cur))asgs.push(cur);
  let opts=tree.map(({r,lv})=>`<option value="${r.id}" ${sid===r.id?'selected':''}>${'— '.repeat(lv)}${esc(V(r,'name'))}${V(r,'pos')?' ('+esc(V(r,'pos'))+')':''}</option>`).join('');
  if(sid&&!tree.some(x=>x.r.id===sid))opts+=`<option value="${sid}" selected>(đã xoá) ${esc(staffName(sid))}</option>`;
  const canExt=t&&!g('done')&&g('due');
  modal(`<h2>${t?'Sửa công việc':'Giao việc mới'}</h2>
    <label>Nội dung công việc *<textarea id="m_title" rows="3">${esc(g('title'))}</textarea></label>
    <label>Người thực hiện<select id="m_staff"><option value="">— Chưa chọn —</option>${opts}</select></label>
    <div class="grid2">
      <label>Người giao việc<select id="m_asg">${asgs.map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}</select></label>
      <label>Lặp lại<select id="m_rep">${Object.entries(REP).map(([k,l])=>`<option value="${k}" ${g('repeat')===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>Ngày giao<input type="date" id="m_start" value="${t?g('start'):today()}"></label>
      <label>Hạn hoàn thành${g('dueOrig')?` <span style="color:var(--warn)">(gốc ${fmtD(g('dueOrig'))})</span>`:''}<input type="date" id="m_due" value="${g('due')}" ${g('dueOrig')?'disabled':''}></label>
    </div>
    ${canExt?`<div class="bar" style="margin-top:-4px"><button class="btn sm" type="button" id="b_ext">Gia hạn có lý do</button></div><div id="extBox"></div>`:''}
    ${g('extLog')?`<div class="mut">Lịch sử gia hạn:</div><div class="log">${esc(g('extLog'))}</div>`:''}

        if(!why){toast('Nhập lý do gia hạn');return}
        if(!V(t,'dueOrig'))setF(t,'dueOrig',od);
        setF(t,'due',nd);
        setF(t,'extLog',(V(t,'extLog')?V(t,'extLog')+'\n':'')+`${fmtD(today())}: ${fmtD(od)} → ${fmtD(nd)} – ${why} (${db.me.name})`);
        save();close();render();openTask(id);toast('Đã gia hạn');
      };
    };
    if(t)q('#b_del').onclick=()=>{if(confirm('Xoá công việc này?')){setF(t,'deleted',true);save();close();render();toast('Đã xoá')}};
    q('#b_save').onclick=()=>{
      const v=k=>q('#m_'+k).value;
      const vals={title:v('title').trim(),staff:v('staff'),assigner:v('asg'),repeat:v('rep'),start:v('start'),done:v('done'),quality:v('q'),note:v('note').trim()};
      if(!g('dueOrig'))vals.due=v('due');
      if(!vals.title){toast('Nhập nội dung công việc');return}
      if(vals.repeat&&!(vals.due||g('due'))){toast('Việc lặp lại cần có hạn hoàn thành');return}
      if(vals.due&&vals.start&&vals.due<vals.start&&!confirm('Hạn hoàn thành đang trước ngày giao. Vẫn lưu?'))return;
      let rec=t;
      if(t){for(const k in vals)setF(t,k,vals[k])}else{rec=mk({...vals,deleted:false});db.tasks[rec.id]=rec}
      if(vals.done)afterDone(rec);
      save();close();render();toast('Đã lưu');
    };
    if(!t)setTimeout(()=>q('#m_title').focus(),50);
  });
}

function bulkStaff(){
  modal(`<h2>Thêm hàng loạt</h2><p class="mut">Mỗi dòng một người: <b>Họ tên ; Chức danh ; Đơn vị</b>. Có thể dán trực tiếp 3 cột từ Excel.</p>

  (m,close)=>{
    m.querySelector('#b_cancel').onclick=close;

      let n=0;const have=new Set(live(db.staff).map(x=>norm(V(x,'name'))));
      m.querySelector('#m_bulk').value.split(/\r?\n/).forEach(line=>{
        const p=line.split(/\t|;/).map(x=>x.trim());if(!p[0]||have.has(norm(p[0])))return;

      });
      save();close();render();toast(`Đã thêm ${n} người (bỏ qua tên trùng)`);

function fmtVal(k,v,w){
  if(k==='deleted'||k==='spawned')return v?'Có':'Không';
  if(v===''||v===undefined||v===null)return '(trống)';
  if(['start','due','done','dueOrig'].includes(k))return fmtD(v);
  if(k==='repeat')return REP[v]||v;
  if(k==='staff'||k==='parent'){const s=w.staff[canon(v,w.aliases)];return s?V(s,'name'):'(?)'}
  return String(v);
}

  el.innerHTML=`<div class="card hl"><h3>File của ${esc(f.me.name)}</h3><div class="mut">Xuất lúc ${fmtT(f.exportedAt)}</div>
    <ul><li>Nhân viên: thêm mới ${st.ns}, cập nhật ${st.us}</li><li>Công việc: thêm mới ${st.nt}, cập nhật ${st.ut}</li><li>Xung đột cần chọn: <b>${conflicts.length}</b></li></ul>
    ${dups.length?`<h4>Nhân viên trùng tên (gộp thành 1 người?)</h4>${dups.map(d=>`<label class="chk"><input type="checkbox" data-dup="${d.key}" ${d.ok?'checked':''}> <span><b>${esc(d.name)}</b> <span class="mut">(của bạn: ${esc(d.lpos||'—')} / của ${esc(f.me.name)}: ${esc(d.rpos||'—')})</span></span></label>`).join('')}`:''}
    ${conflicts.length?`<h4>Cả hai cùng sửa: chọn bản giữ lại</h4>${conflicts.map(c=>`<div class="cf"><div><b>${recName(c)}</b></div><div class="mut">Trường: ${FL[c.k]||c.k}</div>
      <label class="chk"><input type="radio" name="${c.key}" value="me" ${c.c==='me'?'checked':''}> <span>Của tôi: <b>${esc(fmtVal(c.k,c.l.v,w))}</b> <span class="mut">(${fmtT(c.l.t)})</span></span></label>
      <label class="chk"><input type="radio" name="${c.key}" value="them" ${c.c==='them'?'checked':''}> <span>Của ${esc(f.me.name)}: <b>${esc(fmtVal(c.k,c.r.v,w))}</b> <span class="mut">(${fmtT(c.r.t)})</span></span></label></div>`).join('')}`:''}
    <div class="bar"><button class="btn pri" onclick="applyImport()">✓ Xác nhận gộp</button><button class="btn" onclick="imp=null;render()">Huỷ</button></div></div>`;
  el.querySelectorAll('[data-dup]').forEach(x=>x.onchange=()=>{imp.choices[x.dataset.dup]=x.checked;renderPreview()});
  el.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>{imp.choices[x.name]=x.value});
}
function applyImport(){
  if(!imp)return;const res=doMerge(imp.file,imp.choices);
  try{localStorage.setItem(KU,JSON.stringify(db))}catch(e){}
  db=res.w;save();imp=null;render();toast('Đã gộp xong. Mã dữ liệu: '+dataHash(),4000);
}
function undoMerge(){
  let u=null;try{u=localStorage.getItem(KU)}catch(e){}
  if(!u){toast('Không có bản để hoàn tác');return}
  if(!confirm('Quay lại dữ liệu trước lần gộp gần nhất? Mọi thay đổi sau lần gộp đó sẽ mất.'))return;
  db=JSON.parse(u);save();try{localStorage.removeItem(KU)}catch(e){}render();toast('Đã hoàn tác');
}

/* ================== CÀI ĐẶT ================== */
function setLook(k,v){db.settings[k]=v;save();render()}
function renderSet(){
  const S=db.settings;
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${(S[k]||'')===v?'on':''}" onclick="setLook('${k}','${v}')">${l}</button>`).join('')}</div>`;
  $('#main').innerHTML=`
  <div class="sec">Giao diện</div>
  <div class="card">
    <label>Tên đơn vị (hiện ở đầu trang)<div class="inl"><input id="c_title" value="${esc(S.appTitle)}"><button class="btn sm" onclick="saveTitle()">Lưu</button></div></label>
    <div class="mut" style="margin-bottom:6px">Chế độ màu</div>${seg('theme',[['','Tự động'],['light','Sáng'],['dark','Tối']])}
    <div class="mut" style="margin:12px 0 6px">Cỡ chữ</div>${seg('font',[['','Thường'],['large','Lớn']])}
  </div>
  <div class="sec">Tài khoản trên máy này</div>
  <div class="card"><label>Tên của bạn<div class="inl"><input id="c_name" value="${esc(db.me.name)}"><button class="btn sm" onclick="saveName()">Lưu</button></div></label></div>
  <div class="sec">Cách tính KPI</div>
  <div class="card">
    <label class="chk" style="margin-bottom:12px"><input type="checkbox" id="c_orig" ${S.origDue?'checked':''}> <span>Việc đã gia hạn vẫn tính KPI theo <b>hạn gốc</b> <span class="mut">(bỏ chọn để tính theo hạn mới)</span></span></label>
    <label>Trừ điểm cho mỗi ngày trễ<input type="number" id="c_lp" value="${S.latePenalty}" min="0" max="100"></label>
    <div class="grid2"><label>Hệ số "Tốt" (%)<input type="number" id="c_qt" value="${S.qTot}"></label><label>Hệ số "Đạt" (%)<input type="number" id="c_qd" value="${S.qDat}"></label></div>
    <label>Hệ số "Kém" (%)<input type="number" id="c_qk" value="${S.qKem}"></label>
    <div class="mut" style="margin-bottom:8px">Cài đặt chỉ áp dụng trên máy này. Hai chỉ huy nên đặt giống nhau để điểm KPI khớp.</div>
    <button class="btn pri" onclick="saveKpiSet()">Lưu cách tính</button></div>
  <div class="sec">Sao lưu & khôi phục</div>
  <div class="card">
    <p class="mut" style="margin-top:0">Dữ liệu nằm trong trình duyệt của máy này. Nếu xoá dữ liệu trình duyệt hoặc xoá ứng dụng thì sẽ mất, nên hãy xuất file định kỳ ở tab Đồng bộ.</p>
    <label>Khôi phục từ file (thay thế toàn bộ dữ liệu hiện tại)<input type="file" id="c_rest" accept=".json,application/json"></label>
    <button class="btn bad" onclick="wipe()">Xoá toàn bộ dữ liệu trên máy này</button></div>
  <div class="mut" style="text-align:center;margin:14px 0">Chạy hoàn toàn offline · dữ liệu không gửi đi đâu</div>`;
  $('#c_rest').onchange=e=>readJson(e.target,f=>{
    const msg=f.me.id===db.me.id?'Khôi phục toàn bộ dữ liệu từ file sao lưu này? Dữ liệu hiện tại sẽ bị thay thế.':`File này là của "${f.me.name}", không phải của máy này. Khôi phục sẽ biến máy này thành "${f.me.name}". Bạn chắc chắn chứ? (Muốn gộp dữ liệu thì dùng tab Đồng bộ.)`;
    if(confirm(msg)){try{localStorage.setItem(KU,JSON.stringify(db))}catch(x){}restoreFrom(f);render();toast('Đã khôi phục')}
  });
}
function saveTitle(){db.settings.appTitle=$('#c_title').value.trim();save();render();toast('Đã lưu')}
function saveName(){const n=$('#c_name').value.trim();if(!n)return;db.me.name=n;db.peers[db.me.id]=n;save();render();toast('Đã lưu tên')}
function saveKpiSet(){const g=id=>Math.max(0,Number($(id).value)||0);Object.assign(db.settings,{latePenalty:g('#c_lp'),qTot:g('#c_qt'),qDat:g('#c_qd'),qKem:g('#c_qk'),origDue:$('#c_orig').checked});save();render();toast('Đã lưu cách tính')}
function wipe(){if(confirm('Xoá TOÀN BỘ dữ liệu trên máy này?')&&confirm('Chắc chắn? Thao tác không thể hoàn tác nếu bạn chưa xuất file.')){try{localStorage.removeItem(K);localStorage.removeItem(KU)}catch(e){}db=null;render()}}

/* ================== CHẠY ================== */
if(typeof document!=='undefined'&&document.getElementById('main')){
  db=load();
  if(db){db.settings=Object.assign(defSettings(),db.settings||{});db.aliases=db.aliases||{};db.lastImportFrom=db.lastImportFrom||{};db.peers=db.peers||{}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Đã có bản cập nhật mới. Đóng hẳn app rồi mở lại để dùng bản mới.',6000)})});
    }).catch(()=>{});
  }
}
</script>
</body>
</html>
